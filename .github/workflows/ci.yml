# swift-redux-saga の CI。
#
# PR ごとに次のジョブを並列に実行する。
#   - Format: swift format による lint
#   - macOS:  SwiftPM でのビルドとテスト
#   - iOS:    xcodebuild で iOS シミュレータ向けのビルドとテスト
#   - Linux:  UI に依存しないターゲットのビルドとテスト
#   - Other platforms: tvOS / watchOS / visionOS 向けのビルド
#   - Examples: サンプルアプリのロジック（Examples/ExampleKit）のビルドとテスト、アプリのビルド
#
# アクションはタグではなくコミット SHA で固定している（ルールは AGENTS.md）。
# 更新は Dependabot（.github/dependabot.yml）に任せる。

name: CI

on:
  # main への push では実行しない。main には PR 経由でしか入らず、
  # マージ前に同じ内容で CI が通っているため、二重に macOS runner を使わない。
  pull_request:
    types: [opened, synchronize, reopened]
    # ドキュメントだけの変更ではビルド結果が変わらないため実行しない。
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"

# 同じ PR に新しいコミットが積まれたら、古い実行は結果が不要になるのでキャンセルする。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# 読み取りだけで足りるので、GITHUB_TOKEN の権限を最小にする。
permissions:
  contents: read

env:
  # Xcode を明示的に選ぶ。runner の既定の Xcode は予告付きで切り替わるため、
  # 既定に任せるとツールチェーンが知らないうちに変わる。
  # バージョンは推測ではなく actions/runner-images の macos-26-arm64 Readme で確認したもの
  # （Xcode 26.6 / Swift 6.3）。
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  # 同じ Readme で、Xcode 26.6 にインストール済みと確認したシミュレータ。
  IOS_SIMULATOR_NAME: iPhone 17
  IOS_SIMULATOR_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-26-5
  # Package.swift で、このパッケージのターゲットの警告をエラーにする（理由は Package.swift を参照）。
  SWIFT_REDUX_SAGA_WARNINGS_AS_ERRORS: "1"

jobs:
  format:
    name: Format
    # lint に macOS は不要なので、安価な Linux で実行する。
    # 外部ツール（SwiftFormat / SwiftLint）ではなく、ツールチェーン同梱の swift format を使う。
    runs-on: ubuntu-24.04
    container: swift:6.3.3-noble
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: swift format lint
        run: swift format lint --strict --recursive --parallel Package.swift Sources Tests Examples

  macos:
    name: macOS (SwiftPM)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      # ソースが変わっていなくても依存の解決とビルドに時間がかかるため、.build をキャッシュする。
      # ソースが変わった場合も restore-keys で直近のキャッシュから差分ビルドする。
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: spm-macos-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ hashFiles('Sources/**', 'Tests/**') }}
          restore-keys: |
            spm-macos-${{ hashFiles('Package.swift', 'Package.resolved') }}-
      # 「警告ゼロ」は、この環境変数で有効になる Package.swift の treatAllWarnings(as: .error) で保証する。
      # -Xswiftc -warnings-as-errors を使わないのは、依存の swift-syntax にも効いてしまうため。
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: swift test --skip-build

  ios:
    name: iOS Simulator (xcodebuild)
    # SwiftPM だけでは iOS 向けにビルドできないため、xcodebuild を使う。
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve simulator
        id: simulator
        run: |
          # 名前と OS で -destination を指定しない。runner の起動直後は CoreSimulator の準備が
          # 終わっておらず、xcodebuild がシミュレータを見つけられずに失敗することがあるため、
          # simctl で見つかるまで待ってから UDID で指定する。
          for i in $(seq 1 12); do
            udid=$(xcrun simctl list devices available --json \
              | jq -r --arg runtime "$IOS_SIMULATOR_RUNTIME" --arg name "$IOS_SIMULATOR_NAME" \
                '.devices[$runtime][]? | select(.name == $name) | .udid' | head -n 1)
            if [ -n "$udid" ]; then break; fi
            echo "Waiting for the simulator ($i)..."
            sleep 10
          done
          if [ -z "$udid" ]; then
            xcrun simctl list devices available
            echo "::error::$IOS_SIMULATOR_NAME ($IOS_SIMULATOR_RUNTIME) was not found."
            exit 1
          fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      # xcodebuild はパッケージのマクロ（ReduxMacros）を使う前に、利用者の許可を求める。
      # CI では対話できないので -skipMacroValidation で許可する（マクロはこのリポジトリのコード）。
      # スキームは、プロダクトが複数あるパッケージで SwiftPM が作る "<パッケージ名>-Package"。
      - name: Build and test
        run: |
          xcodebuild test \
            -scheme swift-redux-saga-Package \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -skipMacroValidation

  other-platforms:
    name: Build (${{ matrix.platform }})
    # 対応 OS としている tvOS / watchOS / visionOS でビルドできることを確かめる。
    # テストは iOS / macOS / Linux で行うので、ここではビルドだけにして macOS runner の時間を抑える。
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [tvOS Simulator, watchOS Simulator, visionOS Simulator]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: |
          xcodebuild build \
            -scheme swift-redux-saga-Package \
            -destination "generic/platform=${{ matrix.platform }}" \
            -skipMacroValidation

  linux:
    name: Linux
    # Saga / Redux のコアは Apple 以外でも動くことを保証したい。macOS より安価でもある。
    # runner に入っている Swift ではなく公式コンテナを使い、バージョンを固定する。
    runs-on: ubuntu-24.04
    container: swift:6.3.3-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: spm-linux-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ hashFiles('Sources/**', 'Tests/**') }}
          restore-keys: |
            spm-linux-${{ hashFiles('Package.swift', 'Package.resolved') }}-
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: swift test --skip-build

  examples:
    name: Examples
    # サンプルのロジックはライブラリの使い方の見本なので、ライブラリの変更で壊れていないかを確かめる。
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Examples/ExampleKit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Examples/ExampleKit/.build
          key: spm-examples-${{ hashFiles('Package.swift', 'Examples/ExampleKit/Package.swift') }}-${{ hashFiles('Sources/**', 'Examples/**') }}
          restore-keys: |
            spm-examples-${{ hashFiles('Package.swift', 'Examples/ExampleKit/Package.swift') }}-
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: swift test --skip-build
      - name: Build apps
        working-directory: Examples
        # Xcode はローカルパッケージを依存としてビルドするときに -suppress-warnings を付け、
        # 警告をエラーにする設定と衝突するため、アプリのビルドでは無効にする。
        env:
          SWIFT_REDUX_SAGA_WARNINGS_AS_ERRORS: "0"
        run: |
          for scheme in SwiftUIExample UIKitExample; do
            xcodebuild build \
              -project Examples.xcodeproj \
              -scheme "$scheme" \
              -destination "generic/platform=iOS Simulator" \
              CODE_SIGNING_ALLOWED=NO \
              -skipMacroValidation
          done
