<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 310" width="860" height="310" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Segoe UI', sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .node { fill: #ffffff; stroke: #1f2328; stroke-width: 2; }
    .side { fill: #fff8e6; stroke: #9a6700; stroke-width: 2; stroke-dasharray: 6 4; }
    .label { fill: #1f2328; font-size: 18px; text-anchor: middle; dominant-baseline: central; }
    .edge { fill: none; stroke: #1f2328; stroke-width: 2; }
    .sideEdge { fill: none; stroke: #9a6700; stroke-width: 2; stroke-dasharray: 6 4; }
    .edgeLabel { fill: #57606a; font-size: 14px; text-anchor: middle; }
    .sideLabel { fill: #9a6700; font-size: 14px; text-anchor: middle; }
    .head { fill: #1f2328; }
    .sideHead { fill: #9a6700; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .node { fill: #0d1117; stroke: #e6edf3; }
      .side { fill: #2b2111; stroke: #d29922; }
      .label { fill: #e6edf3; }
      .edge { stroke: #e6edf3; }
      .sideEdge { stroke: #d29922; }
      .edgeLabel { fill: #9198a1; }
      .sideLabel { fill: #d29922; }
      .head { fill: #e6edf3; }
      .sideHead { fill: #d29922; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="head"/>
    </marker>
    <marker id="sideArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="sideHead"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="860" height="310"/>

  <!-- 副作用（Saga）: 通常の流れの外側 -->
  <rect class="side" x="250" y="20" width="140" height="48" rx="10"/>
  <text class="label" x="320" y="44">Saga</text>
  <rect class="side" x="530" y="20" width="160" height="48" rx="10"/>
  <text class="label" x="610" y="44">API / UseCase</text>
  <path class="sideEdge" d="M320,128 V72" marker-end="url(#sideArrow)"/>
  <text class="sideLabel" x="378" y="104">Action を受け取る</text>
  <path class="sideEdge" d="M394,44 H526" marker-end="url(#sideArrow)"/>
  <text class="sideLabel" x="460" y="36">call</text>
  <path class="sideEdge" d="M246,44 H110 V126" marker-end="url(#sideArrow)"/>
  <text class="sideLabel" x="178" y="36">put（結果の Action）</text>

  <!-- 通常の流れ（Redux）: 一直線 -->
  <rect class="node" x="40" y="130" width="140" height="48" rx="10"/>
  <text class="label" x="110" y="154">Action</text>
  <rect class="node" x="250" y="130" width="140" height="48" rx="10"/>
  <text class="label" x="320" y="154">Middleware</text>
  <rect class="node" x="460" y="130" width="140" height="48" rx="10"/>
  <text class="label" x="530" y="154">Reducer</text>
  <rect class="node" x="670" y="130" width="140" height="48" rx="10"/>
  <text class="label" x="740" y="154">Store</text>
  <path class="edge" d="M180,154 H246" marker-end="url(#arrow)"/>
  <path class="edge" d="M390,154 H456" marker-end="url(#arrow)"/>
  <path class="edge" d="M600,154 H666" marker-end="url(#arrow)"/>

  <!-- View: State を読んで表示し、操作を Action として送る -->
  <rect class="node" x="355" y="240" width="140" height="48" rx="10"/>
  <text class="label" x="425" y="264">View</text>
  <path class="edge" d="M740,178 V264 H499" marker-end="url(#arrow)"/>
  <text class="edgeLabel" x="620" y="256">State を読んで表示</text>
  <path class="edge" d="M355,264 H110 V182" marker-end="url(#arrow)"/>
  <text class="edgeLabel" x="232" y="256">dispatch</text>
</svg>
