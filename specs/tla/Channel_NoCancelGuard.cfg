\* take のロックの中で Task.isCancelled を確かめない設定。TLC が反例を見つけることを確かめる。
CONSTANTS
    Takers = {t1, t2}
    NumPuts = 3
    MaxTakes = 2
    CloseWithError = FALSE
    CancelGuard = FALSE
    ClearFailure = TRUE
SPECIFICATION Spec
INVARIANTS
    NoDoubleResume
    NoLossInOrder
    ErrorAtMostOnce
    CancelledTakeConsumesNothing
PROPERTIES
    NoTakerLeftWaiting
    CancelledTakerReturns
